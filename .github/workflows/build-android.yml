name: Build Chatsen Mod APK

on:
  workflow_dispatch:
  push:
    branches: [dearking-mod]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # base64 вашего debug.keystore (секрет репозитория DEBUG_KEYSTORE).
      # Без него каждая сборка подписывается новым случайным ключом и не ставится поверх прошлой.
      KS: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        if: ${{ env.KS != '' }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i fingerprint || true

      - name: Warn about random signing key
        if: ${{ env.KS == '' }}
        run: echo "::warning::DEBUG_KEYSTORE secret not set — APK is signed with a random key and will NOT install over the previous build"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ project
        run: |
          flutter create --org com.dearking --project-name chatsen --platforms android .
          rm -rf test
          python3 tool/android_setup.py

      - name: Pub get
        run: flutter pub get

      - name: App icon (optional)
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: chatsen-mod-apk
          path: build/app/outputs/flutter-apk/*-release.apk
