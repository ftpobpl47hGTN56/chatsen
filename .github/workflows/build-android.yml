name: Build Chatsen Mod APK

on:
  workflow_dispatch:
  push:
    branches: [dearking-mod]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # base64 вашего debug.keystore (секрет репозитория DEBUG_KEYSTORE).
      # Без него каждая сборка подписывается новым случайным ключом и не ставится поверх прошлой.
      KS: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        if: ${{ env.KS != '' }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i fingerprint || true

      - name: Warn about random signing key
        if: ${{ env.KS == '' }}
        run: echo "::warning::DEBUG_KEYSTORE secret not set — APK is signed with a random key and will NOT install over the previous build"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ project
        run: |
          flutter create --org com.dearking --project-name chatsen --platforms android .
          rm -rf test
          python3 tool/android_setup.py

      - name: Pub get
        run: flutter pub get

      - name: App icon (optional)
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      # Версия мода — из tool/mod_version.txt, дата — по Новосибирску.
      # Номер сборки растёт с каждым запуском, чтобы обновление ставилось поверх.
      - name: Version
        run: |
          echo "MODV=$(tr -d '[:space:]' < tool/mod_version.txt)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(TZ=Asia/Novosibirsk date +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "BUILD_NUM=$((1200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build APK
        run: flutter build apk --release --split-per-abi --build-name="$MODV" --build-number="$BUILD_NUM"

      - name: Rename APKs (version + date)
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "chatsen-mod-v${MODV}-${BUILD_DATE}-${abi}.apk"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: chatsen-mod-v${{ env.MODV }}-${{ env.BUILD_DATE }}
          path: build/app/outputs/flutter-apk/chatsen-mod-*.apk
